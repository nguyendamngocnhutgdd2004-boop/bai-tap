<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Căn giữa phần tử</title>
  
  <style>
    .flex-container {
      display: flex;
      justify-content: center;
      align-items: center;

      height: 100px;
      background-color: rgb(13, 124, 124);
      color: white;
      text-align: center;
      line-height: 100px;
    }
  </style>
</head>
<body>
    <div class="flex-container">
      <div class="flex-item">Centered</div>
    </div>

</body>
