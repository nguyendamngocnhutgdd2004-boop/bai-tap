<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo navbar cơ bản với CSS</title>
    <style>
    /* reset css mặc định */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    /* css trang web */
    h1 {
      background-color: black;
      color: white;
      text-align: center;
      padding: 10px; /* khoảng cách giữa đường viên và nội dung  */
    }
    p {
      background-color: rgb(161, 161, 161);
      text-align: center; /* căn các nội dung bên trong vào giữa */
    }
    a {
      text-decoration: none; /* loại bỏ gạch chân dưới thẻ a */
      color: #313131;
      margin-right: 10px; /* Khoảng cách các phần tử */
    }
    </style>
  </head>
  <body>
      <h1>Trang web của tôi</h1>
      <p>
        <a href="">Trang chủ</a>
        <a href="">Giới thiệu</a>
        <a href="">Sản phẩm</a>
        <a href="">Liên hệ</a>
      </p>
  </body>
</html>
