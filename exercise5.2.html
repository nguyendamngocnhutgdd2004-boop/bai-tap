<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập về pseudo class :hover</title>
    
    <style>
    ul {
      list-style: none;
    }
    li {
      background-color: #cecece;
      margin-bottom: 10px;
      padding: 10px;
    }
    li:hover {
      background-color: gray;
    }
    </style>
  </head>
  <body>
    <ul>
      <li>item 1</li>
      <li>item 2</li>
      <li>item 3</li>
      <li>item 4</li>
    </ul>
  </body>
</html>
