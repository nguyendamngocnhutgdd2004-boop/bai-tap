<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Thao tác với pseudo class :hover thành thạo</title>
    <style>
    body {
      font-family: Arial;
    }
    .box {
      background-color: beige;
      width: 400px;
      text-align: center;
      padding: 30px;
    }
    h2 {
      color: blue;
    }
    p {
      color: black;
      }
    button {
      padding: 10px 20px;
      border: 1px solid #999;
      background-color: white;
      cursor: pointer;
    }
    /* hover*/
    button:hover {
      background-color: green;
      color: white;
    }
    </style>
  </head>
  <body> 
    <div class="box">
      <h2>Trích dẫn nổi bật</h2>
      <p>"Kiến thức là sức mạnh."</p>
      <button> Đọc thêm </button>
    </div>
  </body>
</html>
