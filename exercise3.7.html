<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo form thông tin sở thích</title>
</head>
<body>
<form action="" method="post">
  <div class="form-title">SỞ THÍCH CỦA BẠN</div>
  <div >
    <label for="hoten">Họ và tên</label>
    <input type="text" id="hoten" name="hoten">
  </div>
  <div>
    <label for="email">Email</label>
    <input type="email" id="email" name="email">
  </div>
  <div>
    <label>Sở thích</label>
  <div class="checkbox-grid">
    <label><input type="checkbox" name="sothich[]" value="thethao"> Thể thao</label>
    <label><input type="checkbox" name="sothich[]" value="amnhac"> Âm nhạc</label>
    <label><input type="checkbox" name="sothich[]" value="docsach"> Đọc sách</label><br><br/>
    <label><input type="checkbox" name="sothich[]" value="luotweb"> Lướt web</label>
    <label><input type="checkbox" name="sothich[]" value="choigame"> Chơi game</label>
    <label><input type="checkbox" name="sothich[]" value="dienanh"> Điện ảnh</label><br><br/>
    <label><input type="checkbox" name="sothich[]" value="dulich"> Du lịch</label>
  </div>
  </div>
  <div>
    <button type="submit">Gửi thông tin</button>
    <button type="reset">Nhập lại</button>
  </div>
  </div>
  </div>
</form>
 
</body>
</html>
