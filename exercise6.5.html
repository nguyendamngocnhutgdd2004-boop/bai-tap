<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo ra một trang web landing page</title>
    
    <style>
    /* reset css mặc định */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    /* Header: MyLogo và Menu chung nền xanh lá */
    .header {
      background-color: rgb(9, 255, 0);
      display: flex;
      justify-content: space-between; 
      align-items: center;
      padding: 15px 20px;
    }

    .header p {
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .menu a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-weight: bold;
    }

    /* Phần Hero: Khung xám nhạt căn giữa */
    .hero {
      text-align: center;
      padding: 60px 20px;
      background-color: #f4f4f4; /* Màu xám nhạt */
      margin: 30px 20px;         /* Khoảng cách bên ngoài khung */
      border-radius: 15px;       /* Bo góc khung */
      border: 1px solid #ddd;
    }

    .hero h1 {
      margin-bottom: 15px;
      font-size: 32px;
    }

    .hero p {
      margin-bottom: 25px;
      font-size: 18px;
      color: #555;
    }

    .btn-get-started {
      padding: 12px 35px;
      background-color: rgb(9, 255, 0);
      color: white;
      border-radius: 5px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-get-started:hover {
      background-color: rgb(7, 200, 0);
      transform: scale(1.05);
    }

    /* Các nút Feature */
    .projects {
      display: flex;
      gap: 20px;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .projects button {
      flex: 1;
      padding: 15px;
      background-color: rgb(223, 223, 231);
      color: black;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    .projects button:hover {
      background-color: #555;
    }

    /* Footer */
    .text {
      background-color: black;
      text-align: center;
      padding: 20px 0;
      margin-top: 40px;
      color: white;
      border-top: 1px solid #ddd;
    }
    </style>
  </head>
  <body>
    <!-- Header nền xanh lá -->
    <div class="header">
      <p>MyLogo</p>
      <div class="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
      </div>
    </div>

    <!-- Phần Hero với khung xám -->
    <div class="hero">
      <h1>Welcome to My Website</h1>
      <p>We provide the best solutions for your business.</p>
      <button class="btn-get-started">Get Started</button>
    </div>

    <!-- Các tính năng/dự án -->
    <div class="projects">
      <button>Feature 1</button>
      <button>Feature 2</button>
      <button>Feature 3</button>
    </div>

    <!-- Chân trang -->
    <p class="text">Contact us: <b>email@example.com</b></p>
  </body>
</html>
