<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo form tìm kiếm và lọc sản phẩm</title>
</head>
<body>
  <h1>Tìm kiếm sản phẩm</h1>
  <form action="">
    <p>Từ khóa tìm kiếm:</p>
      <input type="Từ khóa tìm kiếm" /><br><br/>
      <label for="">Loại sản phẩm:</label><br><br/>
    <select name ="Loại sản phẩm:">
      <option value="Điện tử">Điện tử</option>
      <option value="Máy móc">Máy móc</option>
      <option value="Gia dụng">Gia dụng</option>
    </select><br><br/>
    <button>Tìm kiếm</button>
    </form>
  
</body>
</html>
