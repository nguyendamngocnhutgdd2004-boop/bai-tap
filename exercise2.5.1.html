<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo bảng có chứa thông tin sản phẩm trong cửa hàng của bạn:</title>
</head>
<body>
  <h2>My Store</h2>
  <table border="1">
    <tr>
      <th>Item photo</th>
      <th>NAME</th>
      <th>Price</th>
    </tr>
    <tr>
            <td>
                <img src="cam.jpg" alt="Oranges" width="200" height="150">
            </td>
            <td style="text-align: center;">Oranges</td>
            <td>$1 ea.</td>
        </tr>

        <tr>
            <td>
                <img src="img banana">
            </td>
            <td style="text-align: center;">Bananas</td>
            <td>$0.75/lb</td>
        </tr>

        <tr>
            <td>
                <img src="luu.png" alt="Pomegranates" width="200" height="150">
            </td>
            <td  style="text-align: center;">Pomegranates</td>
            <td>3 for $5</td>
        </tr>

        <tr>
            <td>
                <img src="img Gummy Bears">
            </td>
            <td  style="text-align: center;">Gummy Bears</td>
            <td>$6 per bag</td>
        </tr>

        <tr>
            <td>
                <img src="bong cai.jpg" alt="Broccoli" width="200" height="150">
            </td>
            <td  style="text-align: center;">Broccoli</td>
            <td>$3 a head</td>
        </tr>
  </table>
  
</body>
</html>
