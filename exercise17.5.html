<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hiện đăng nhập</title>
    <link href="17.5.css" rel="stylesheet">
  </head>
<body>
  <div class="bg"></div>
  <div class="bridge"></div>
  <div class="fog"></div>

  <p class="page-title">Elegant Login Form</p>

  <div class="card">
    <div class="card-header">
      <h1>Log In</h1>
    </div>

    <div class="card-body">
      <div class="input-wrap">
        <input type="email" id="emailInput" placeholder="Email" autocomplete="username"/>
        <p class="err-msg" id="emailErr">Vui lòng nhập email.</p>
      </div>

      <div class="input-wrap">
        <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password"/>
        <p class="err-msg" id="passErr">Vui lòng nhập mật khẩu.</p>
      </div>

      <button class="btn-submit" id="loginBtn">Submit</button>

      <div class="divider"><span>OR</span></div>

      <div class="socials">
        <button class="social-btn fb" title="Facebook">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
        </button>
        <button class="social-btn tw" title="Twitter">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/></svg>
        </button>
        <button class="social-btn gp" title="Google">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12.24 10.285V13.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l2.427-2.334C17.955 2.192 15.34 1 12.24 1 6.033 1 1 6.033 1 12.24s5.033 11.24 11.24 11.24c6.478 0 10.793-4.537 10.793-10.986 0-.746-.08-1.32-.176-1.885H12.24z"/></svg>
        </button>
      </div>
    </div>

    <div class="card-footer">
      <p>No account yet? <a href="#">Signup</a></p>
      <p><a href="#">Forgot your password?</a></p>
    </div>
  </div>

  <div class="page-footer">
    © 2017 Elegant Login Form . All Rights Reserved | Design by W3layouts
  </div>
    <script src="./exercise17.5.js"></script>
</body>
</html>
