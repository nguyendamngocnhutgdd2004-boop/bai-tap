<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Làm quen với CSS basic</title>
    <style>
    /* reset css mặc định */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    /* css trang web */
    h1 {
      background-color: black;
      color: white;
      text-align: center;
    }
    p {
      text-align: center;
    }
    div {
      text-align: center;
    }
    </style>
  </head>
  <body>
    <h1>Chào mừng đến với trang web của tôi</h1>
    <p>Đây là trang web đầu tiên của tôi. Tôi đang học lập trình web và đây là sản phẩm đầu tiên của tôi</p>
    <div>
      <img
        width="300"
        src="https://plus.unsplash.com/premium_photo-1682050733502-f58b7f499490?q=80&w=1288&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        alt=""
      >
    </div>
    <p>Trang web của tôi được tạo bởi tôi</p>
  </body>
</html>
