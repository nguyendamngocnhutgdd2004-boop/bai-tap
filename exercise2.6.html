<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài tập tổng hợp form và table</title>
</head>
<body>
    <h1>Trang web bán hàng</h1>

      <li>Trang chủ</li>

      <li>Giới thiệu</li>

      <th>Tên sản phẩm</th>
      <th>Mô tả</th>

     <tbody>
    <tr>
      <td>Sản phẩm 1</td>
      <td>Mô tả sản phẩm 1</td>

    <tr>
      <td>Sản phẩm 2</td>
      <td>Mô tả sản phẩm 1</td>
      <td>200.000đ</td>
      <td>5</td>
    </tr>
    <tr>
      <td>Sản phẩm 3</td>
      <td>Mô tả sản phẩm 1</td>
      <td>300.000đ</td>
      <td>3</td>
    </tr>
    </tbody>
  </table>
  <h2>Thông tin người dùng</h2>
  <form action="">
    <label for="">Họ và tên:</label>
      <input type="" /> <br />
    <label for="">Email:</label>
      <input type="" /> <br />
    <label for="">Số điện thoại:</label>
      <input type="" /> <br />
    <label for="">Địa chỉ:</label>
      <input type="" /> <br />
    <button>Đặt hàng</button>
    </form>
  
</body>
</html>
