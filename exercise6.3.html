<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio cá nhân</title>
    
    <style>
    /* reset css mặc định */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Header: h1 bên trái, menu bên phải */
    .header {
      background-color: rgb(41, 41, 42);
      display: flex;
      justify-content: space-between; 
      align-items: center;
      padding: 15px 20px;
    }

    .header h1 {
      color: white;
      font-size: 24px;
    }

    .menu a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    /* Phần Profile */
    .profile {
      background-color: rgb(228, 235, 242);
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 30px 20px;
      gap: 20px;
    }

    .profile img {
      border-radius: 50%;
      width: 150px;
      height: 150px;
      border: 3px solid blue;
      object-fit: cover;
    }

    .profile-text {
      max-width: 500px; /* Tăng độ rộng để chữ hiển thị đẹp */
      font-size: 18px;
      text-align: left;
    }

    /* Tiêu đề Dự án */
    .title-projects {
      padding: 20px 20px 10px;
      font-weight: bold;
    }

    /* Các nút dự án */
    .projects {
      display: flex;
      gap: 10px;
      padding: 0 20px 20px;
    }

    .projects button {
      flex: 1;
      padding: 12px;
      background-color: rgb(41, 41, 42);
      color: white;
      border-radius: 4px;
      border: none;
      cursor: pointer; /* Thêm con trỏ chuột khi rê vào */
    }

    .projects button:hover {
      background-color: #555; /* Hiệu ứng khi di chuột */
    }

    /* Footer */
    .text {
      background-color: aliceblue;
      text-align: center;
      padding: 15px 0;
      margin-top: 20px;
    }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>Portfolio của TSUBASA</h1>
      <div class="menu">
        <a href="#">Home</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
      </div>
    </div>

    <div class="profile">
      <img src="hinh the.jpg" alt="ảnh cá nhân">
      <div class="profile-text">
        <p>Xin chào! Tôi là TSUBASA, một lập trình viên đam mê học hỏi và sáng tạo.</p>
      </div>
    </div>

    <p class="title-projects">Dự án của tôi</p>
    
    <div class="projects">
      <button>Dự án 1</button>
      <button>Dự án 2</button>
      <button>Dự án 3</button>
      <button>Dự án 4</button>
    </div>

    <p class="text">Kết nối với tôi trên <b>LinkedIn</b> | <b>GitHub</b></p>
  </body>
</html>
